[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "finsight-ai"
version = "0.1.0"
description = "FinSight AI — Financial Intelligence Agent. Turn financial documents into business decisions."
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[project.scripts]
finsight = "src.api.main:run"
finagent = "src.api.main:run"


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
